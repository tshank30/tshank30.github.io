<svg xmlns="http://www.w3.org/2000/svg" width="360" height="760" viewBox="0 0 360 760" role="img" aria-labelledby="title desc"><title id="title">Photo analysis on-device and in the cloud</title><desc id="desc">Local analysis stays on your phone. Cloud analysis uploads media to provider servers before returning suggestions.</desc><rect width="360" height="760" rx="20" fill="white"/><g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><text x="24" y="36" font-size="19" fill="#181025" font-weight="700">Where are photos analyzed?</text><rect x="16" y="60" width="328" height="316" rx="16" fill="#f6f0fe"/><text x="36" y="90" font-size="12" fill="#6528b2" font-weight="700" letter-spacing="1">ON-DEVICE ANALYSIS</text><rect x="36" y="106" width="288" height="64" rx="10" fill="white" stroke="#e0d1ef"/><text x="180" y="132" text-anchor="middle" font-size="15" fill="#281a38" font-weight="600">Your photo library</text><text x="180" y="154" text-anchor="middle" font-size="12" fill="#62516f">On your phone</text><path d="M180 174v12m-4-4 4 4 4-4" fill="none" stroke="#9977b9" stroke-width="2"/><rect x="36" y="192" width="288" height="64" rx="10" fill="white" stroke="#e0d1ef"/><text x="180" y="218" text-anchor="middle" font-size="15" fill="#281a38" font-weight="600">Analyze locally</text><text x="180" y="240" text-anchor="middle" font-size="12" fill="#62516f">No media upload for analysis</text><path d="M180 260v12m-4-4 4 4 4-4" fill="none" stroke="#9977b9" stroke-width="2"/><rect x="36" y="278" width="288" height="64" rx="10" fill="white" stroke="#e0d1ef"/><text x="180" y="304" text-anchor="middle" font-size="15" fill="#281a38" font-weight="600">Review suggestions</text><text x="180" y="326" text-anchor="middle" font-size="12" fill="#62516f">Choose what to keep</text><rect x="16" y="394" width="328" height="316" rx="16" fill="#f5f7fa"/><text x="36" y="424" font-size="12" fill="#6528b2" font-weight="700" letter-spacing="1">CLOUD ANALYSIS</text><rect x="36" y="440" width="288" height="64" rx="10" fill="white" stroke="#e0d1ef"/><text x="180" y="466" text-anchor="middle" font-size="15" fill="#281a38" font-weight="600">Your photo library</text><text x="180" y="488" text-anchor="middle" font-size="12" fill="#62516f">On your phone</text><path d="M180 508v12m-4-4 4 4 4-4" fill="none" stroke="#9977b9" stroke-width="2"/><rect x="36" y="526" width="288" height="64" rx="10" fill="white" stroke="#e0d1ef"/><text x="180" y="552" text-anchor="middle" font-size="15" fill="#281a38" font-weight="600">Provider servers</text><text x="180" y="574" text-anchor="middle" font-size="12" fill="#62516f">Media uploaded for analysis</text><path d="M180 594v12m-4-4 4 4 4-4" fill="none" stroke="#9977b9" stroke-width="2"/><rect x="36" y="612" width="288" height="64" rx="10" fill="white" stroke="#e0d1ef"/><text x="180" y="638" text-anchor="middle" font-size="15" fill="#281a38" font-weight="600">Review suggestions</text><text x="180" y="660" text-anchor="middle" font-size="12" fill="#62516f">Results return to your phone</text><text x="24" y="747" font-size="10" fill="#64748b">Analytics and existing cloud backups are separate.</text></g></svg>