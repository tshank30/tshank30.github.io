<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="title desc"><title id="title">A smaller video needs a real comparison</title><desc id="desc">Conceptual diagram. SOURCE: Keep an original. Preserve an independent copy. Note size, duration and format. EXPORT: Create a candidate. Choose suitable output settings. A smaller file can lose detail. CHECK: Inspect the result. Play sound, motion and dark scenes. Then decide which copy to keep.</desc><rect width="960" height="460" rx="24" fill="#f5f1fc"/><path d="M0 0H960V112H0Z" fill="#25143d"/><text x="36" y="45" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">A smaller video needs a real comparison</text><rect x="24" y="136" width="288" height="288" rx="16" fill="#fff" stroke="#dcd2e8"/><rect x="42" y="156" width="82" height="30" rx="8" fill="#6d28d9"/><text x="53" y="176" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">SOURCE</text><text x="42" y="217" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">Keep an original</text><text x="42" y="254" fill="#435166" font-family="Arial,sans-serif" font-size="17">Preserve an independent</text><text x="42" y="278" fill="#435166" font-family="Arial,sans-serif" font-size="17">copy</text><text x="42" y="309" fill="#435166" font-family="Arial,sans-serif" font-size="17">Note size, duration and</text><text x="42" y="333" fill="#435166" font-family="Arial,sans-serif" font-size="17">format</text><rect x="336" y="136" width="288" height="288" rx="16" fill="#fff" stroke="#dcd2e8"/><rect x="354" y="156" width="82" height="30" rx="8" fill="#087f73"/><text x="365" y="176" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">EXPORT</text><text x="354" y="217" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">Create a candidate</text><text x="354" y="254" fill="#435166" font-family="Arial,sans-serif" font-size="17">Choose suitable output</text><text x="354" y="278" fill="#435166" font-family="Arial,sans-serif" font-size="17">settings</text><text x="354" y="309" fill="#435166" font-family="Arial,sans-serif" font-size="17">A smaller file can lose</text><text x="354" y="333" fill="#435166" font-family="Arial,sans-serif" font-size="17">detail</text><rect x="648" y="136" width="288" height="288" rx="16" fill="#fff" stroke="#dcd2e8"/><rect x="666" y="156" width="72" height="30" rx="8" fill="#a34712"/><text x="677" y="176" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">CHECK</text><text x="666" y="217" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">Inspect the result</text><text x="666" y="254" fill="#435166" font-family="Arial,sans-serif" font-size="17">Play sound, motion and</text><text x="666" y="278" fill="#435166" font-family="Arial,sans-serif" font-size="17">dark scenes</text><text x="666" y="309" fill="#435166" font-family="Arial,sans-serif" font-size="17">Then decide which copy to</text><text x="666" y="333" fill="#435166" font-family="Arial,sans-serif" font-size="17">keep</text><text x="36" y="440" fill="#586579" font-family="Arial,sans-serif" font-size="13">Fast Cleaner guides · Conceptual illustration</text></svg>