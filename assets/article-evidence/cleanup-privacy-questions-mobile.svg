<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1030" viewBox="0 0 360 1030" role="img" aria-labelledby="title desc"><title id="title">Three different privacy questions</title><desc id="desc">Three different privacy questions. Photo access does not establish photo upload. PERMISSION: What can it read?. Selected photos or a library. Access can limit scan results. Check each requested feature. PROCESSING: Where does it run?. On your device or elsewhere. Read the media-processing policy. A claim needs its own evidence. OTHER DATA: What else is collected?. Usage events and diagnostics. Advertising identifiers. Read the label and the policy.</desc><rect width="360" height="1030" rx="24" fill="#f5f1fc"/><rect width="360" height="176" rx="24" fill="#25143d"/><text x="22" y="40" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="700">Three different privacy</text><text x="22" y="70" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="700">questions</text><text x="22" y="117" fill="#dfd0ef" font-family="Arial,sans-serif" font-size="16">Photo access does not establish</text><text x="22" y="139" fill="#dfd0ef" font-family="Arial,sans-serif" font-size="16">photo upload.</text><rect x="18" y="196" width="324" height="238" rx="18" fill="#fff" stroke="#dfd3ee"/><circle cx="52" cy="232" r="12" fill="#6d28d9"/><text x="76" y="238" fill="#6d28d9" font-family="Arial,sans-serif" font-size="15" font-weight="700">PERMISSION</text><text x="40" y="282" fill="#25143d" font-family="Arial,sans-serif" font-size="23" font-weight="700">What can it read?</text><text x="40" y="324" fill="#435166" font-family="Arial,sans-serif" font-size="16">Selected photos or a library</text><text x="40" y="356" fill="#435166" font-family="Arial,sans-serif" font-size="16">Access can limit scan results</text><text x="40" y="388" fill="#435166" font-family="Arial,sans-serif" font-size="16">Check each requested feature</text><rect x="18" y="454" width="324" height="238" rx="18" fill="#fff" stroke="#dfd3ee"/><circle cx="52" cy="490" r="12" fill="#087f73"/><text x="76" y="496" fill="#087f73" font-family="Arial,sans-serif" font-size="15" font-weight="700">PROCESSING</text><text x="40" y="540" fill="#25143d" font-family="Arial,sans-serif" font-size="23" font-weight="700">Where does it run?</text><text x="40" y="582" fill="#435166" font-family="Arial,sans-serif" font-size="16">On your device or elsewhere</text><text x="40" y="614" fill="#435166" font-family="Arial,sans-serif" font-size="16">Read the media-processing policy</text><text x="40" y="646" fill="#435166" font-family="Arial,sans-serif" font-size="16">A claim needs its own evidence</text><rect x="18" y="712" width="324" height="238" rx="18" fill="#fff" stroke="#dfd3ee"/><circle cx="52" cy="748" r="12" fill="#a34712"/><text x="76" y="754" fill="#a34712" font-family="Arial,sans-serif" font-size="15" font-weight="700">OTHER DATA</text><text x="40" y="798" fill="#25143d" font-family="Arial,sans-serif" font-size="23" font-weight="700">What else is collected?</text><text x="40" y="840" fill="#435166" font-family="Arial,sans-serif" font-size="16">Usage events and diagnostics</text><text x="40" y="872" fill="#435166" font-family="Arial,sans-serif" font-size="16">Advertising identifiers</text><text x="40" y="904" fill="#435166" font-family="Arial,sans-serif" font-size="16">Read the label and the policy</text><text x="22" y="1006" fill="#586579" font-family="Arial,sans-serif" font-size="13">Fast Cleaner · Editorial illustration · November 24, 2026</text></svg>