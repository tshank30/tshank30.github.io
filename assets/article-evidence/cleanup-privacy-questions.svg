<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Three different privacy questions</title><desc id="desc">Three different privacy questions. Photo access does not establish photo upload. PERMISSION: What can it read?. Selected photos or a library. Access can limit scan results. Check each requested feature. PROCESSING: Where does it run?. On your device or elsewhere. Read the media-processing policy. A claim needs its own evidence. OTHER DATA: What else is collected?. Usage events and diagnostics. Advertising identifiers. Read the label and the policy.</desc><rect width="1200" height="720" rx="24" fill="#f5f1fc"/><rect width="1200" height="190" rx="24" fill="#25143d"/><text x="46" y="78" fill="#fff" font-family="Arial,sans-serif" font-size="42" font-weight="700">Three different privacy questions</text><text x="46" y="126" fill="#dfd0ef" font-family="Arial,sans-serif" font-size="24">Photo access does not establish photo upload.</text><rect x="30" y="226" width="360" height="400" rx="18" fill="#fff" stroke="#dfd3ee"/><circle cx="64" cy="262" r="12" fill="#6d28d9"/><text x="88" y="268" fill="#6d28d9" font-family="Arial,sans-serif" font-size="15" font-weight="700">PERMISSION</text><text x="52" y="312" fill="#25143d" font-family="Arial,sans-serif" font-size="23" font-weight="700">What can it read?</text><text x="52" y="354" fill="#435166" font-family="Arial,sans-serif" font-size="19">Selected photos or a library</text><text x="52" y="404" fill="#435166" font-family="Arial,sans-serif" font-size="19">Access can limit scan results</text><text x="52" y="454" fill="#435166" font-family="Arial,sans-serif" font-size="19">Check each requested feature</text><rect x="420" y="226" width="360" height="400" rx="18" fill="#fff" stroke="#dfd3ee"/><circle cx="454" cy="262" r="12" fill="#087f73"/><text x="478" y="268" fill="#087f73" font-family="Arial,sans-serif" font-size="15" font-weight="700">PROCESSING</text><text x="442" y="312" fill="#25143d" font-family="Arial,sans-serif" font-size="23" font-weight="700">Where does it run?</text><text x="442" y="354" fill="#435166" font-family="Arial,sans-serif" font-size="19">On your device or elsewhere</text><text x="442" y="404" fill="#435166" font-family="Arial,sans-serif" font-size="19">Read the media-processing policy</text><text x="442" y="454" fill="#435166" font-family="Arial,sans-serif" font-size="19">A claim needs its own evidence</text><rect x="810" y="226" width="360" height="400" rx="18" fill="#fff" stroke="#dfd3ee"/><circle cx="844" cy="262" r="12" fill="#a34712"/><text x="868" y="268" fill="#a34712" font-family="Arial,sans-serif" font-size="15" font-weight="700">OTHER DATA</text><text x="832" y="312" fill="#25143d" font-family="Arial,sans-serif" font-size="23" font-weight="700">What else is collected?</text><text x="832" y="354" fill="#435166" font-family="Arial,sans-serif" font-size="19">Usage events and diagnostics</text><text x="832" y="404" fill="#435166" font-family="Arial,sans-serif" font-size="19">Advertising identifiers</text><text x="832" y="454" fill="#435166" font-family="Arial,sans-serif" font-size="19">Read the label and the policy</text><text x="46" y="696" fill="#586579" font-family="Arial,sans-serif" font-size="17">Fast Cleaner · Editorial illustration · November 24, 2026</text></svg>