<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="title desc"><title id="title">Measure the result of a cleanup</title><desc id="desc">Conceptual diagram. DIAGNOSE: Read the storage screen. Find the largest category. Separate device and cloud usage. REVIEW: Choose unwanted files. Inspect suggestions before removal. Preserve important copies. MEASURE: Check the same meter. Compare actual storage used. A file count is not a byte total.</desc><rect width="960" height="460" rx="24" fill="#f5f1fc"/><path d="M0 0H960V112H0Z" fill="#25143d"/><text x="36" y="45" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">Measure the result of a cleanup</text><rect x="24" y="136" width="288" height="288" rx="16" fill="#fff" stroke="#dcd2e8"/><rect x="42" y="156" width="102" height="30" rx="8" fill="#6d28d9"/><text x="53" y="176" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">DIAGNOSE</text><text x="42" y="217" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">Read the storage</text><text x="42" y="244" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">screen</text><text x="42" y="280" fill="#435166" font-family="Arial,sans-serif" font-size="17">Find the largest category</text><text x="42" y="311" fill="#435166" font-family="Arial,sans-serif" font-size="17">Separate device and cloud</text><text x="42" y="335" fill="#435166" font-family="Arial,sans-serif" font-size="17">usage</text><rect x="336" y="136" width="288" height="288" rx="16" fill="#fff" stroke="#dcd2e8"/><rect x="354" y="156" width="82" height="30" rx="8" fill="#087f73"/><text x="365" y="176" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">REVIEW</text><text x="354" y="217" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">Choose unwanted files</text><text x="354" y="254" fill="#435166" font-family="Arial,sans-serif" font-size="17">Inspect suggestions</text><text x="354" y="278" fill="#435166" font-family="Arial,sans-serif" font-size="17">before removal</text><text x="354" y="309" fill="#435166" font-family="Arial,sans-serif" font-size="17">Preserve important copies</text><rect x="648" y="136" width="288" height="288" rx="16" fill="#fff" stroke="#dcd2e8"/><rect x="666" y="156" width="92" height="30" rx="8" fill="#a34712"/><text x="677" y="176" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">MEASURE</text><text x="666" y="217" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">Check the same meter</text><text x="666" y="254" fill="#435166" font-family="Arial,sans-serif" font-size="17">Compare actual storage</text><text x="666" y="278" fill="#435166" font-family="Arial,sans-serif" font-size="17">used</text><text x="666" y="309" fill="#435166" font-family="Arial,sans-serif" font-size="17">A file count is not a</text><text x="666" y="333" fill="#435166" font-family="Arial,sans-serif" font-size="17">byte total</text><text x="36" y="440" fill="#586579" font-family="Arial,sans-serif" font-size="13">Fast Cleaner guides · Conceptual illustration</text></svg>