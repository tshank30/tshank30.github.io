<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1030" viewBox="0 0 360 1030" role="img" aria-labelledby="title desc"><title id="title">Before choosing a cleaner</title><desc id="desc">Before choosing a cleaner. Compare the job, the purchase, and the data flow. THE JOB: What needs cleaning?. Photos and similar shots. Large videos or screenshots. Contacts or email?. THE PURCHASE: What will you pay?. Check usable free limits. Read the renewal interval. Confirm the checkout offer. THE DATA: What gets accessed?. Review photo permissions. Separate media and analytics. Keep control of deletion.</desc><rect width="360" height="1030" rx="24" fill="#f5f1fc"/><rect width="360" height="176" rx="24" fill="#25143d"/><text x="22" y="40" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="700">Before choosing a</text><text x="22" y="70" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="700">cleaner</text><text x="22" y="117" fill="#dfd0ef" font-family="Arial,sans-serif" font-size="16">Compare the job, the purchase, and</text><text x="22" y="139" fill="#dfd0ef" font-family="Arial,sans-serif" font-size="16">the data flow.</text><rect x="18" y="196" width="324" height="238" rx="18" fill="#fff" stroke="#dfd3ee"/><circle cx="52" cy="232" r="12" fill="#6d28d9"/><text x="76" y="238" fill="#6d28d9" font-family="Arial,sans-serif" font-size="15" font-weight="700">THE JOB</text><text x="40" y="282" fill="#25143d" font-family="Arial,sans-serif" font-size="23" font-weight="700">What needs cleaning?</text><text x="40" y="324" fill="#435166" font-family="Arial,sans-serif" font-size="16">Photos and similar shots</text><text x="40" y="356" fill="#435166" font-family="Arial,sans-serif" font-size="16">Large videos or screenshots</text><text x="40" y="388" fill="#435166" font-family="Arial,sans-serif" font-size="16">Contacts or email?</text><rect x="18" y="454" width="324" height="238" rx="18" fill="#fff" stroke="#dfd3ee"/><circle cx="52" cy="490" r=