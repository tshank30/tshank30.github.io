<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="title desc"><title id="title">Read three different privacy signals</title><desc id="desc">Conceptual diagram. ACCESS: Which media can it read?. Check selected or full access. Permissions define the scope. ANALYSIS: Where is it processed?. Local analysis or provider servers. Read the media-processing policy. ANALYTICS: What else is transmitted?. Events and diagnostics are separate. Read third-party disclosures.</desc><rect width="960" height="460" rx="24" fill="#f5f1fc"/><path d="M0 0H960V112H0Z" fill="#25143d"/><text x="36" y="45" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">Read three different privacy signals</text><rect x="24" y="136" width="288" height="288" rx="16" fill="#fff" stroke="#dcd2e8"/><rect x="42" y="156" width="82" height="30" rx="8" fill="#6d28d9"/><text x="53" y="176" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">ACCESS</text><text x="42" y="217" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">Which media can it</text><text x="42" y="244" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">read?</text><text x="42" y="280" fill="#435166" font-family="Arial,sans-serif" font-size="17">Check selected or full</text><text x="42" y="304" fill="#435166" font-family="Arial,sans-serif" font-size="17">access</text><text x="42" y="335" fill="#435166" font-family="Arial,sans-serif" font-size="17">Permissions define the</text><text x="42" y="359" fill="#435166" font-family="Arial,sans-serif" font-size="17">scope</text><rect x="336" y="136" width="288" height="288" rx="16" fill="#fff" stroke="#dcd2e8"/><rect x="354" y="156" width="102" height="30" rx="8" fill="#087f73"/><text x="365" y="176" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">ANALYSIS</text><text x="354" y="217" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">Where is it</text><text x="354" y="244" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">processed?</text><text x="354" y="280" fill="#435166" font-family="Arial,sans-serif" font-size="17">Local analysis or</text><text x="354" y="304" fill="#435166" font-family="Arial,sans-serif" font-size="17">provider servers</text><text x="354" y="335" fill="#435166" font-family="Arial,sans-serif" font-size="17">Read the media-processing</text><text x="354" y="359" fill="#435166" font-family="Arial,sans-serif" font-size="17">policy</text><rect x="648" y="136" width="288" height="288" rx="16" fill="#fff" stroke="#dcd2e8"/><rect x="666" y="156" width="112" height="30" rx="8" fill="#a34712"/><text x="677" y="176" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">ANALYTICS</text><text x="666" y="217" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">What else is</text><text x="666" y="244" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">transmitted?</text><text x="666" y="280" fill="#435166" font-family="Arial,sans-serif" font-size="17">Events and diagnostics</text><text x="666" y="304" fill="#435166" font-family="Arial,sans-serif" font-size="17">are separate</text><text x="666" y="335" fill="#435166" font-family="Arial,sans-serif" font-size="17">Read third-party</text><text x="666" y="359" fill="#435166" font-family="Arial,sans-serif" font-size="17">disclosures</text><text x="36" y="440" fill="#586579" font-family="Arial,sans-serif" font-size="13">Fast Cleaner guides · Conceptual illustration</text></svg>