<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="title desc"><title id="title">Review Android storage in stages</title><desc id="desc">Conceptual diagram. DOWNLOADS: Remove replaceable files. Use the app that downloaded them. Keep what you need offline. APP DATA: Choose the right action. Cache and storage are different. Do not erase app data blindly. MEDIA: Inspect unwanted items. Review groups in Fast Cleaner. Keep important photos and videos.</desc><rect width="960" height="460" rx="24" fill="#f5f1fc"/><path d="M0 0H960V112H0Z" fill="#25143d"/><text x="36" y="45" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">Review Android storage in stages</text><rect x="24" y="136" width="288" height="288" rx="16" fill="#fff" stroke="#dcd2e8"/><rect x="42" y="156" width="112" height="30" rx="8" fill="#6d28d9"/><text x="53" y="176" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">DOWNLOADS</text><text x="42" y="217" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">Remove replaceable</text><text x="42" y="244" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">files</text><text x="42" y="280" fill="#435166" font-family="Arial,sans-serif" font-size="17">Use the app that</text><text x="42" y="304" fill="#435166" font-family="Arial,sans-serif" font-size="17">downloaded them</text><text x="42" y="335" fill="#435166" font-family="Arial,sans-serif" font-size="17">Keep what you need</text><text x="42" y="359" fill="#435166" font-family="Arial,sans-serif" font-size="17">offline</text><rect x="336" y="136" width="288" height="288" rx="16" fill="#fff" stroke="#dcd2e8"/><rect x="354" y="156" width="102" height="30" rx="8" fill="#087f73"/><text x="365" y="176" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">APP DATA</text><text x="354" y="217" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">Choose the right</text><text x="354" y="244" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">action</text><text x="354" y="280" fill="#435166" font-family="Arial,sans-serif" font-size="17">Cache and storage are</text><text x="354" y="304" fill="#435166" font-family="Arial,sans-serif" font-size="17">different</text><text x="354" y="335" fill="#435166" font-family="Arial,sans-serif" font-size="17">Do not erase app data</text><text x="354" y="359" fill="#435166" font-family="Arial,sans-serif" font-size="17">blindly</text><rect x="648" y="136" width="288" height="288" rx="16" fill="#fff" stroke="#dcd2e8"/><rect x="666" y="156" width="72" height="30" rx="8" fill="#a34712"/><text x="677" y="176" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">MEDIA</text><text x="666" y="217" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">Inspect unwanted</text><text x="666" y="244" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">items</text><text x="666" y="280" fill="#435166" font-family="Arial,sans-serif" font-size="17">Review groups in Fast</text><text x="666" y="304" fill="#435166" font-family="Arial,sans-serif" font-size="17">Cleaner</text><text x="666" y="335" fill="#435166" font-family="Arial,sans-serif" font-size="17">Keep important photos and</text><text x="666" y="359" fill="#435166" font-family="Arial,sans-serif" font-size="17">videos</text><text x="36" y="440" fill="#586579" font-family="Arial,sans-serif" font-size="13">Fast Cleaner guides · Conceptual illustration</text></svg>