<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1000" width="360" height="1000" role="img" aria-labelledby="title desc"><title id="title">Measure the result of a cleanup</title><desc id="desc">Conceptual diagram. DIAGNOSE: Read the storage screen. Find the largest category. Separate device and cloud usage. REVIEW: Choose unwanted files. Inspect suggestions before removal. Preserve important copies. MEASURE: Check the same meter. Compare actual storage used. A file count is not a byte total.</desc><rect width="360" height="1000" rx="24" fill="#f5f1fc"/><path d="M0 0H360V140H0Z" fill="#25143d"/><text x="24" y="38" fill="#fff" font-family="Arial,sans-serif" font-size="23" font-weight="700">Measure the result of a</text><text x="24" y="68" fill="#fff" font-family="Arial,sans-serif" font-size="23" font-weight="700">cleanup</text><rect x="20" y="164" width="320" height="246" rx="16" fill="#fff" stroke="#dcd2e8"/><rect x="38" y="184" width="102" height="30" rx="8" fill="#6d28d9"/><text x="49" y="204" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">DIAGNOSE</text><text x="38" y="245" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">Read the storage screen</text><text x="38" y="282" fill="#435166" font-family="Arial,sans-serif" font-size="17">Find the largest category</text><text x="38" y="313" fill="#435166" font-family="Arial,sans-serif" font-size="17">Separate device and cloud</text><text x="38" y="337" fill="#435166" font-family="Arial,sans-serif" font-size="17">usage</text><rect x="20" y="434" width="320" height="246" rx="16" fill="#fff" stroke="#dcd2e8"/><rect x="38" y="454" width="82" height="30" rx="8" fill="#087f73"/><text x="49" y="474" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">REVIEW</text><text x="38" y="515" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">Choose unwanted files</text><text x="38" y="552" fill="#435166" font-family="Arial,sans-serif" font-size="17">Inspect suggestions before</text><text x="38" y="576" fill="#435166" font-family="Arial,sans-serif" font-size="17">removal</text><text x="38" y="607" fill="#435166" font-family="Arial,sans-serif" font-size="17">Preserve important copies</text><rect x="20" y="704" width="320" height="246" rx="16" fill="#fff" stroke="#dcd2e8"/><rect x="38" y="724" width="92" height="30" rx="8" fill="#a34712"/><text x="49" y="744" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">MEASURE</text><text x="38" y="785" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">Check the same meter</text><text x="38" y="822" fill="#435166" font-family="Arial,sans-serif" font-size="17">Compare actual storage used</text><text x="38" y="853" fill="#435166" font-family="Arial,sans-serif" font-size="17">A file count is not a byte</text><text x="38" y="877" fill="#435166" font-family="Arial,sans-serif" font-size="17">total</text><text x="24" y="980" fill="#586579" font-family="Arial,sans-serif" font-size="13">Fast Cleaner guides · Conceptual illustration</text></svg>