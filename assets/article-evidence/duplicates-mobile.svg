nt-size="17">Compare faces, motion and</text><text x="38" y="576" fill="#435166" font-family="Arial,sans-serif" font-size="17">text</text><text x="38" y="607" fill="#435166" font-family="Arial,sans-serif" font-size="17">Small differences can matter</text><rect x="20" y="704" width="320" height="246" rx="16" fill="#fff" stroke="#dcd2e8"/><rect x="38" y="724" width="62" height="30" rx="8" fill="#a34712"/><text x="49" y="744" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">EDIT</text><text x="38" y="785" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">A different version</text><text x="38" y="822" fill="#435166" font-family="Arial,sans-serif" font-size="17">A crop may have another</text><text x="38" y="846" fill="#435166" font-family="Arial,sans-serif" font-size="17">purpose</text><text x="38" y="877" fill="#435166" font-family="Arial,sans-serif" font-size="17">Preserve the source if needed</text><text x="24" y="980" fill="#586579" font-family="Arial,sans-serif" font-size="13">Fast Cleaner guides · Conceptual illustration</text></svg>