442" y="353" fill="#435166" font-family="Arial,sans-serif" font-size="18">Faces and expressions</text><text x="442" y="403" fill="#435166" font-family="Arial,sans-serif" font-size="18">Different framing or text</text><text x="442" y="453" fill="#435166" font-family="Arial,sans-serif" font-size="18">Keep meaningful variations</text><rect x="810" y="226" width="360" height="400" rx="18" fill="white" stroke="#dfd3ee"/><text x="832" y="265" fill="#a34712" font-family="Arial,sans-serif" font-size="15" font-weight="700">EDITED VERSION</text><text x="832" y="309" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">Preserve useful sources</text><text x="832" y="353" fill="#435166" font-family="Arial,sans-serif" font-size="18">Check the original file</text><text x="832" y="403" fill="#435166" font-family="Arial,sans-serif" font-size="18">Decide about future edits</text><text x="832" y="453" fill="#435166" font-family="Arial,sans-serif" font-size="18">Keep both when needed</text><text x="46" y="696" fill="#586579" font-family="Arial,sans-serif" font-size="17">Fast Cleaner · Editorial illustration · November 24, 2026</text></svg>