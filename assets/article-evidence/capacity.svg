<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="title desc"><title id="title">Three storage questions</title><desc id="desc">Conceptual diagram. DEVICE: Files on your phone. Photos, videos and downloads. Check device storage settings. CLOUD: Files in a service. Backups and synced libraries. Check the cloud storage meter. MEMORY: Programs running now. RAM is a separate resource. Removing files does not add RAM.</desc><rect width="960" height="460" rx="24" fill="#f5f1fc"/><path d="M0 0H960V112H0Z" fill="#25143d"/><text x="36" y="45" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">Three storage questions</text><rect x="24" y="136" width="288" height="288" rx="16" fill="#fff" stroke="#dcd2e8"/><rect x="42" y="156" width="82" height="30" rx="8" fill="#6d28d9"/><text x="53" y="176" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">DEVICE</text><text x="42" y="217" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">Files on your phone</text><text x="42" y="254" fill="#435166" font-family="Arial,sans-serif" font-size="17">Photos, videos and</text><text x="42" y="278" fill="#435166" font-family="Arial,sans-serif" font-size="17">downloads</text><text x="42" y="309" fill="#435166" font-family="Arial,sans-serif" font-size="17">Check device storage</text><text x="42" y="333" fill="#435166" font-family="Arial,sans-serif" font-size="17">settings</text><rect x="336" y="136" width="288" height="288" rx="16" fill="#fff" stroke="#dcd2e8"/><rect x="354" y="156" width="72" height="30" rx="8" fill="#087f73"/><text x="365" y="176" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">CLOUD</text><text x="354" y="217" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">Files in a service</text><text x="354" y="254" fill="#435166" font-family="Arial,sans-serif" font-size="17">Backups and synced</text><text x="354" y="278" fill="#435166" font-family="Arial,sans-serif" font-size="17">libraries</text><text x="354" y="309" fill="#435166" font-family="Arial,sans-serif" font-size="17">Check the cloud storage</text><text x="354" y="333" fill="#435166" font-family="Arial,sans-serif" font-size="17">meter</text><rect x="648" y="136" width="288" height="288" rx="16" fill="#fff" stroke="#dcd2e8"/><rect x="666" y="156" width="82" height="30" rx="8" fill="#a34712"/><text x="677" y="176" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">MEMORY</text><text x="666" y="217" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">Programs running now</text><text x="666" y="254" fill="#435166" font-family="Arial,sans-serif" font-size="17">RAM is a separate</text><text x="666" y="278" fill="#435166" font-family="Arial,sans-serif" font-size="17">resource</text><text x="666" y="309" fill="#435166" font-family="Arial,sans-serif" font-size="17">Removing files does not</text><text x="666" y="333" fill="#435166" font-family="Arial,sans-serif" font-size="17">add RAM</text><text x="36" y="440" fill="#586579" font-family="Arial,sans-serif" font-size="13">Fast Cleaner guides · Conceptual illustration</text></svg>