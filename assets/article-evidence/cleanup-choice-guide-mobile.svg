<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1030" viewBox="0 0 360 1030" role="img" aria-labelledby="title desc"><title id="title">Choose the workflow before the app</title><desc id="desc">Choose the workflow before the app. A decision guide, not a performance ranking. START SIMPLE: Identified duplicates. Check Apple Photos first. Review the copies it identifies. Decide whether that is enough. REVIEW MEDIA: Photos and videos. Compare grouping and controls. Try a backed-up selection. Check price and free limits. BROADER TASKS: Contacts and email. Confirm the tool you need. Review additional permissions. Check the chosen billing plan.</desc><rect width="360" height="1030" rx="24" fill="#f5f1fc"/><rect width="360" height="176" rx="24" fill="#25143d"/><text x="22" y="40" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="700">Choose the workflow</text><text x="22" y="70" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="700">before the app</text><text x="22" y="117" fill="#dfd0ef" font-family="Arial,sans-serif" font-size="16">A decision guide, not a performance</text><text x="22" y="139" fill="#dfd0ef" font-family="Arial,sans-serif" font-size="16">ranking.</text><rect x="18" y="196" width="324" height="238" rx="18" fill="#fff" stroke="#dfd3ee"/><circle cx="52" cy="232" r="12" fill="#6d28d9"/><text x="76" y="238" fill="#6d28d9" font-family="Arial,sans-serif" font-size="15" font-weight="700">START SIMPLE</text><text x="40" y="282" fill="#25143d" font-family="Arial,sans-serif" font-size="23" font-weight="700">Identified duplicates</text><text x="40" y="324" fill="#435166" font-family="Arial,sans-serif" font-size="16">Check Apple Photos first</text><text x="40" y="356" fill="#435166" font-family="Arial,sans-serif" font-size="16">Review the copies it identifies</text><text x="40" y="388" fill="#435166" font-family="Arial,sans-serif" font-size="16">Decide whether that is enough</text><rect x="18" y="454" width="324" hei