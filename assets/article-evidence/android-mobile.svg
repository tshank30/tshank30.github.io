<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1000" width="360" height="1000" role="img" aria-labelledby="title desc"><title id="title">Review Android storage in stages</title><desc id="desc">Conceptual diagram. DOWNLOADS: Remove replaceable files. Use the app that downloaded them. Keep what you need offline. APP DATA: Choose the right action. Cache and storage are different. Do not erase app data blindly. MEDIA: Inspect unwanted items. Review groups in Fast Cleaner. Keep important photos and videos.</desc><rect width="360" height="1000" rx="24" fill="#f5f1fc"/><path d="M0 0H360V140H0Z" fill="#25143d"/><text x="24" y="38" fill="#fff" font-family="Arial,sans-serif" font-size="23" font-weight="700">Review Android storage in</text><text x="24" y="68" fill="#fff" font-family="Arial,sans-serif" font-size="23" font-weight="700">stages</text><rect x="20" y="164" width="320" height="246" rx="16" fill="#fff" stroke="#dcd2e8"/><rect x="38" y="184" width="112" height="30" rx="8" fill="#6d28d9"/><text x="49" y="204" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">DOWNLOADS</text><text x="38" y="245" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">Remove replaceable files</text><text x="38" y="282" fill="#435166" font-family="Arial,sans-serif" font-size="17">Use the app that downloaded</text><text x="38" y="306" fill="#435166" font-family="Arial,sans-serif" font-size="17">them</text><text x="38" y="337" fill="#435166" font-family="Arial,sans-serif" font-size="17">Keep what you need offline</text><rect x="20" y="434" width="320" height="246" rx="16" fill="#fff" stroke="#dcd2e8"/><rect x="38" y="454" width="102" height="30" rx="8" fill="#087f73"/><text x="49" y="474" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">APP DATA</text><text x="38" y="515" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">Choose the right action</text><text x="38" y="552" fill="#435166" font-family="Arial,sans-serif" font-size="17">Cache and storage are</text><text x="38" y="576" fill="#435166" font-family="Arial,sans-serif" font-size="17">different</text><text x="38" y="607" fill="#435166" font-family="Arial,sans-serif" font-size="17">Do not erase app data blindly</text><rect x="20" y="704" width="320" height="246" rx="16" fill="#fff" stroke="#dcd2e8"/><rect x="38" y="724" width="72" height="30" rx="8" fill="#a34712"/><text x="49" y="744" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">MEDIA</text><text x="38" y="785" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">Inspect unwanted items</text><text x="38" y="822" fill="#435166" font-family="Arial,sans-serif" font-size="17">Review groups in Fast Cleaner</text><text x="38" y="853" fill="#435166" font-family="Arial,sans-serif" font-size="17">Keep important photos and</text><text x="38" y="877" fill="#435166" font-family="Arial,sans-serif" font-size="17">videos</text><text x="24" y="980" fill="#586579" font-family="Arial,sans-serif" font-size="13">Fast Cleaner guides · Conceptual illustration</text></svg>