<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="title desc"><title id="title">Photo privacy has more than one layer</title><desc id="desc">Conceptual diagram. PIXELS: What the picture reveals. A sign, face or landmark. Visible clues remain in the image. METADATA: What the record stores. Location, time or service estimates. Check file and service controls. SHARING: What the recipient receives. An export, album or shared link. Inspect the particular share flow.</desc><rect width="960" height="460" rx="24" fill="#f5f1fc"/><path d="M0 0H960V112H0Z" fill="#25143d"/><text x="36" y="45" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">Photo privacy has more than one layer</text><rect x="24" y="136" width="288" height="288" rx="16" fill="#fff" stroke="#dcd2e8"/><rect x="42" y="156" width="82" height="30" rx="8" fill="#6d28d9"/><text x="53" y="176" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">PIXELS</text><text x="42" y="217" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">What the picture</text><text x="42" y="244" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">reveals</text><text x="42" y="280" fill="#435166" font-family="Arial,sans-serif" font-size="17">A sign, face or landmark</text><text x="42" y="311" fill="#435166" font-family="Arial,sans-serif" font-size="17">Visible clues remain in</text><text x="42" y="335" fill="#435166" font-family="Arial,sans-serif" font-size="17">the image</text><rect x="336" y="136" width="288" height="288" rx="16" fill="#fff" stroke="#dcd2e8"/><rect x="354" y="156" width="102" height="30" rx="8" fill="#087f73"/><text x="365" y="176" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">METADATA</text><text x="354" y="217" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">What the record</text><text x="354" y="244" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">stores</text><text x="354" y="280" fill="#435166" font-family="Arial,sans-serif" font-size="17">Location, time or service</text><text x="354" y="304" fill="#435166" font-family="Arial,sans-serif" font-size="17">estimates</text><text x="354" y="335" fill="#435166" font-family="Arial,sans-serif" font-size="17">Check file and service</text><text x="354" y="359" fill="#435166" font-family="Arial,sans-serif" font-size="17">controls</text><rect x="648" y="136" width="288" height="288" rx="16" fill="#fff" stroke="#dcd2e8"/><rect x="666" y="156" width="92" height="30" rx="8" fill="#a34712"/><text x="677" y="176" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">SHARING</text><text x="666" y="217" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">What the recipient</text><text x="666" y="244" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">receives</text><text x="666" y="280" fill="#435166" font-family="Arial,sans-serif" font-size="17">An export, album or</text><text x="666" y="304" fill="#435166" font-family="Arial,sans-serif" font-size="17">shared link</text><text x="666" y="335" fill="#435166" font-family="Arial,sans-serif" font-size="17">Inspect the particular</text><text x="666" y="359" fill="#435166" font-family="Arial,sans-serif" font-size="17">share flow</text><text x="36" y="440" fill="#586579" font-family="Arial,sans-serif" font-size="13">Fast Cleaner guides · Conceptual illustration</text></svg>