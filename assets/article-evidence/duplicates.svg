<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="title desc"><title id="title">Look alike does not mean interchangeable</title><desc id="desc">Conceptual diagram. COPY: Same picture again. Check usable versions. Keep the file you actually need. MOMENT: Another expression. Compare faces, motion and text. Small differences can matter. EDIT: A different version. A crop may have another purpose. Preserve the source if needed.</desc><rect width="960" height="460" rx="24" fill="#f5f1fc"/><path d="M0 0H960V112H0Z" fill="#25143d"/><text x="36" y="45" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">Look alike does not mean interchangeable</text><rect x="24" y="136" width="288" height="288" rx="16" fill="#fff" stroke="#dcd2e8"/><rect x="42" y="156" width="62" height="30" rx="8" fill="#6d28d9"/><text x="53" y="176" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">COPY</text><text x="42" y="217" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">Same picture again</text><text x="42" y="254" fill="#435166" font-family="Arial,sans-serif" font-size="17">Check usable versions</text><text x="42" y="285" fill="#435166" font-family="Arial,sans-serif" font-size="17">Keep the file you</text><text x="42" y="309" fill="#435166" font-family="Arial,sans-serif" font-size="17">actually need</text><rect x="336" y="136" width="288" height="288" rx="16" fill="#fff" stroke="#dcd2e8"/><rect x="354" y="156" width="82" height="30" rx="8" fill="#087f73"/><text x="365" y="176" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">MOMENT</text><text x="354" y="217" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">Another expression</text><text x="354" y="254" fill="#435166" font-family="Arial,sans-serif" font-size="17">Compare faces, motion and</text><text x="354" y="278" fill="#435166" font-family="Arial,sans-serif" font-size="17">text</text><text x="354" y="309" fill="#435166" font-family="Arial,sans-serif" font-size="17">Small differences can</text><text x="354" y="333" fill="#435166" font-family="Arial,sans-serif" font-size="17">matter</text><rect x="648" y="136" width="288" height="288" rx="16" fill="#fff" stroke="#dcd2e8"/><rect x="666" y="156" width="62" height="30" rx="8" fill="#a34712"/><text x="677" y="176" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">EDIT</text><text x="666" y="217" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">A different version</text><text x="666" y="254" fill="#435166" font-family="Arial,sans-serif" font-size="17">A crop may have another</text><text x="666" y="278" fill="#435166" font-family="Arial,sans-serif" font-size="17">purpose</text><text x="666" y="309" fill="#435166" font-family="Arial,sans-serif" font-size="17">Preserve the source if</text><text x="666" y="333" fill="#435166" font-family="Arial,sans-serif" font-size="17">needed</text><text x="36" y="440" fill="#586579" font-family="Arial,sans-serif" font-size="13">Fast Cleaner guides · Conceptual illustration</text></svg>