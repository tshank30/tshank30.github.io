<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="title desc"><title id="title">Different actions affect different copies</title><desc id="desc">Conceptual diagram. DEVICE COPY: Free local space. Verify the cloud backup first. Cloud-only media needs access. LIBRARY ITEM: Delete an unwanted photo. Sync may affect other devices. Check the provider’s rules. RETAINED COPY: Keep an independent original. Open the copy before deletion. A synced view is not independent.</desc><rect width="960" height="460" rx="24" fill="#f5f1fc"/><path d="M0 0H960V112H0Z" fill="#25143d"/><text x="36" y="45" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">Different actions affect different copies</text><rect x="24" y="136" width="288" height="288" rx="16" fill="#fff" stroke="#dcd2e8"/><rect x="42" y="156" width="132" height="30" rx="8" fill="#6d28d9"/><text x="53" y="176" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">DEVICE COPY</text><text x="42" y="217" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">Free local space</text><text x="42" y="254" fill="#435166" font-family="Arial,sans-serif" font-size="17">Verify the cloud backup</text><text x="42" y="278" fill="#435166" font-family="Arial,sans-serif" font-size="17">first</text><text x="42" y="309" fill="#435166" font-family="Arial,sans-serif" font-size="17">Cloud-only media needs</text><text x="42" y="333" fill="#435166" font-family="Arial,sans-serif" font-size="17">access</text><rect x="336" y="136" width="288" height="288" rx="16" fill="#fff" stroke="#dcd2e8"/><rect x="354" y="156" width="142" height="30" rx="8" fill="#087f73"/><text x="365" y="176" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">LIBRARY ITEM</text><text x="354" y="217" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">Delete an unwanted</text><text x="354" y="244" 