<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1000" width="360" height="1000" role="img" aria-labelledby="title desc"><title id="title">Three storage questions</title><desc id="desc">Conceptual diagram. DEVICE: Files on your phone. Photos, videos and downloads. Check device storage settings. CLOUD: Files in a service. Backups and synced libraries. Check the cloud storage meter. MEMORY: Programs running now. RAM is a separate resource. Removing files does not add RAM.</desc><rect width="360" height="1000" rx="24" fill="#f5f1fc"/><path d="M0 0H360V140H0Z" fill="#25143d"/><text x="24" y="38" fill="#fff" font-family="Arial,sans-serif" font-size="23" font-weight="700">Three storage questions</text><rect x="20" y="164" width="320" height="246" rx="16" fill="#fff" stroke="#dcd2e8"/><rect x="38" y="184" width="82" height="30" rx="8" fill="#6d28d9"/><text x="49" y="204" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">DEVICE</text><text x="38" y="245" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">Files on your phone</text><text x="38" y="282" fill="#435166" font-family="Arial,sans-serif" font-size="17">Photos, videos and downloads</text><text x="38" y="313" fill="#435166" font-family="Arial,sans-serif" font-size="17">Check device storage settings</text><rect x="20" y="434" width="320" height="246" rx="16" fill="#fff" stroke="#dcd2e8"/><rect x="38" y="454" width="72" height="30" rx="8" fill="#087f73"/><text x="49" y="474" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">CLOUD</text><text x="38" y="515" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">Files in a service</text><text x="38" y="552" fill="#435166" font-family="Arial,sans-serif" font-size="17">Backups and synced libraries</text><text x="38" y="583" fill="#435166" font-family="Arial,sans-serif" font-size="17">Check the cloud storage meter</text><rect x="20" y="704" width="320" height="246" rx="16" fill="#fff" stroke="#dcd2e8"/><rect x="38" y="724" width="82" height="30" rx="8" fill="#a34712"/><text x="49" y="744" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">MEMORY</text><text x="38" y="785" fill="#25143d" font-family="Arial,sans-serif" font-size="22" font-weight="700">Programs running now</text><text x="38" y="822" fill="#435166" font-family="Arial,sans-serif" font-size="17">RAM is a separate resource</text><text x="38" y="853" fill="#435166" font-family="Arial,sans-serif" font-size="17">Removing files does not add</text><text x="38" y="877" fill="#435166" font-family="Arial,sans-serif" font-size="17">RAM</text><text x="24" y="980" fill="#586579" font-family="Arial,sans-serif" font-size="13">Fast Cleaner guides · Conceptual illustration</text></svg>