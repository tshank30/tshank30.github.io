<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Selected U.S. iPhone Pro launch starting prices</title><desc id="desc">2019 iPhone 11 Pro, 64GB, 999 dollars. 2023 iPhone 15 Pro, 128GB, 999 dollars. 2025 iPhone 17 Pro, 256GB, 1099 dollars. 2026 iPhone 18 Pro, 256GB, 1199 dollars. Nominal U.S. starting prices, not a fixed-specification comparison.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f5efff"/><stop offset="1" stop-color="#fff"/></linearGradient><linearGradient id="bar" x2="0" y2="1"><stop stop-color="#9e69da"/><stop offset="1" stop-color="#6c2cba"/></linearGradient></defs>
<rect width="1200" height="720" rx="32" fill="url(#bg)"/><circle cx="1160" cy="50" r="175" fill="#e6f0ea" opacity=".65"/>
<g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><text x="68" y="68" fill="#6a3f91" font-weight="700" font-size="15" letter-spacing="3">THE COST OF ENTERING THE PRO RANGE</text><text x="68" y="126" fill="#2f1e42" font-size="39" font-weight="750">Higher starting prices. Different devices.</text><text x="68" y="159" fill="#786783" font-size="17">Selected U.S. iPhone Pro launches · nominal dollars · before sales tax</text>
<g stroke="#e4dcec" stroke-width="1"><path d="M114 190H1120M114 375H1120M114 560H1120"/></g><g fill="#786783" font-size="13" text-anchor="end"><text x="98" y="195">$1,400</text><text x="98" y="380">$700</text><text x="98" y="565">$0</text></g>
<g fill="url(#bar)"><rect x="160" y="295.98" width="155" height="264.02" rx="8"/><rect x="410" y="295.98" width="155" height="264.02" rx="8"/><rect x="660" y="269.55" width="155" height="290.45" rx="8"/><rect x="910" y="243.12" width="155" height="316.88" rx="8"/></g>
<g fill="#512881" font-size="28" font-weight="700" text-anchor="middle"><text x="237" y="277.98">$999</text><text x="487" y="277.98">$999</text><text x="737" y="251.55">$1,099</text><text x="987" y="225.12">$1,199</text></g>
<g text-anchor="middle"><g fill="#2f1e42" font-size="22" font-weight="700"><text x="237" y="597">2019</text><text x="487" y="597">2023</text><text x="737" y="597">2025</text><text x="987" y="597">2026</text></g><g fill="#786783" font-size="14"><text x="237" y="623">11 Pro · 64GB</text><text x="487" y="623">15 Pro · 128GB</text><text x="737" y="623">17 Pro · 256GB</text><text x="987" y="623">18 Pro · 256GB</text></g></g>
<text x="68" y="675" fill="#786783" font-size="12">Source: Apple launch announcements. Storage and features change. Not inflation adjusted or a global phone-price index.</text></g></svg>
