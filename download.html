<script>
(function () {
  var APPLE_URL = "https://apps.apple.com/app/fast-cleaner-ai-photo-clean/id6446206167";
  var GOOGLE_URL = "https://play.google.com/store/apps/details?id=com.crocapps.fastphotocleaner";

  function isIOS() {
    var ua = navigator.userAgent || navigator.vendor || "";
    var iOSDevice = /iPad|iPhone|iPod/.test(ua);
    var iPadOS = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
    return iOSDevice || iPadOS;
  }

  function isAndroid() {
    return /Android/i.test(navigator.userAgent || navigator.vendor || "");
  }

  function setStatus(message) {
    var status = document.getElementById("download-status");
    if (status) {
      status.textContent = message;
    }
  }

  function redirectTo(url, message) {
    setStatus(message);
    window.setTimeout(function () {
      window.location.replace(url);
    }, 350);
  }

  function initDownloadLanding() {
    var params = new URLSearchParams(window.location.search);
    var store = params.get("store");

    if (store === "android") {
      redirectTo(GOOGLE_URL, "Opening Google Play...");
      return;
    }

    if (store === "ios") {
      redirectTo(APPLE_URL, "Opening the App Store...");
      return;
    }

    if (isAndroid()) {
      redirectTo(GOOGLE_URL, "Opening Google Play...");
      return;
    }

    if (isIOS()) {
      redirectTo(APPLE_URL, "Opening the App Store...");
      return;
    }

    setStatus("Choose your app store.");
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initDownloadLanding);
  } else {
    initDownloadLanding();
  }
})();
</script>
